<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="850" viewBox="0 0 1360 850"><defs></defs><rect width="100%" height="100%" fill="#fbfbfa"/><text x="40" y="64" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1e1e1e">RoPE: position as rotation</text><text x="40" y="93" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#6b7280">16 of each head's 48 numbers are rotated by an angle proportional to the token's position</text><rect x="61" y="161" width="38" height="38" rx="8" fill="#4dabf7" fill-opacity="1" /><rect x="101" y="161" width="38" height="38" rx="8" fill="#4dabf7" fill-opacity="1" /><rect x="141" y="161" width="38" height="38" rx="8" fill="#f06595" fill-opacity="1" /><text x="200" y="176" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#6b7280">one head:</text><text x="200" y="196" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#6b7280">32 content + 16 position</text><path d="M150 202L300 270" fill="none" stroke="#f06595" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="6 5"/><path d="M178 202L1200 270" fill="none" stroke="#f06595" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="6 5"/><text x="420" y="155" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#f06595">the 16 position numbers form 8 pairs; pair i turns at speed θᵢ = 10000^(−2i/16)</text><text x="340" y="293" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280">pair 0</text><circle cx="340" cy="350" r="42" fill="#ffffff" stroke="#ced4da" stroke-width="1.6"/><line x1="340" y1="350" x2="367.140481156359" y2="326.34848244612357" stroke="#4dabf7" stroke-width="3.2" stroke-linecap="round"/><circle cx="340" cy="350" r="3" fill="#343a40"/><circle cx="340" cy="470" r="42" fill="#ffffff" stroke="#ced4da" stroke-width="1.6"/><line x1="340" y1="470" x2="316.46882964890995" y2="497.2448898310854" stroke="#fd7e14" stroke-width="3.2" stroke-linecap="round"/><circle cx="340" cy="470" r="3" fill="#343a40"/><circle cx="340" cy="610" r="42" fill="#ffffff" stroke="#ced4da" stroke-width="1.6"/><line x1="340" y1="610" x2="367.140481156359" y2="586.3484824461236" stroke="#4dabf7" stroke-width="3.2" stroke-linecap="round"/><line x1="340" y1="610" x2="316.46882964890995" y2="637.2448898310854" stroke="#fd7e14" stroke-width="3.2" stroke-linecap="round"/><circle cx="340" cy="610" r="3" fill="#343a40"/><text x="340" y="674" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b7280">fast</text><text x="465" y="293" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280">pair 1</text><circle cx="465" cy="350" r="42" fill="#ffffff" stroke="#ced4da" stroke-width="1.6"/><line x1="465" y1="350" x2="443.42025385284956" y2="321.1848207323892" stroke="#4dabf7" stroke-width="3.2" stroke-linecap="round"/><circle cx="465" cy="350" r="3" fill="#343a40"/><circle cx="465" cy="470" r="42" fill="#ffffff" stroke="#ced4da" stroke-width="1.6"/><line x1="465" y1="470" x2="475.8409486530771" y2="435.6710933424709" stroke="#fd7e14" stroke-width="3.2" stroke-linecap="round"/><circle cx="465" cy="470" r="3" fill="#343a40"/><circle cx="465" cy="610" r="42" fill="#ffffff" stroke="#ced4da" stroke-width="1.6"/><line x1="465" y1="610" x2="443.42025385284956" y2="581.1848207323892" stroke="#4dabf7" stroke-width="3.2" stroke-linecap="round"/><line x1="465" y1="610" x2="475.8409486530771" y2="575.6710933424708" stroke="#fd7e14" stroke-width="3.2" stroke-linecap="round"/><circle cx="465" cy="610" r="3" fill="#343a40"/><text x="465" y="674" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b7280">fast</text><text x="590" y="293" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280">pair 2</text><circle cx="590" cy="350" r="42" fill="#ffffff" stroke="#ced4da" stroke-width="1.6"/><line x1="590" y1="350" x2="617.5343187422416" y2="326.8081632594431" stroke="#4dabf7" stroke-width="3.2" stroke-linecap="round"/><circle cx="590" cy="350" r="3" fill="#343a40"/><circle cx="590" cy="470" r="42" fill="#ffffff" stroke="#ced4da" stroke-width="1.6"/><line x1="590" y1="470" x2="623.1581957841039" y2="455.98093967688857" stroke="#fd7e14" stroke-width="3.2" stroke-linecap="round"/><circle cx="590" cy="470" r="3" fill="#343a40"/><circle cx="590" cy="610" r="42" fill="#ffffff" stroke="#ced4da" stroke-width="1.6"/><line x1="590" y1="610" x2="617.5343187422416" y2="586.8081632594431" stroke="#4dabf7" stroke-width="3.2" stroke-linecap="round"/><line x1="590" y1="610" x2="623.1581957841039" y2="595.9809396768886" stroke="#fd7e14" stroke-width="3.2" stroke-linecap="round"/><circle cx="590" cy="610" r="3" fill="#343a40"/><text x="590" y="674" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b7280">fast</text><text x="715" y="293" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280">pair 3</text><circle cx="715" cy="350" r="42" fill="#ffffff" stroke="#ced4da" stroke-width="1.6"/><line x1="715" y1="350" x2="750.1215956226944" y2="342.0959807113129" stroke="#4dabf7" stroke-width="3.2" stroke-linecap="round"/><circle cx="715" cy="350" r="3" fill="#343a40"/><circle cx="715" cy="470" r="42" fill="#ffffff" stroke="#ced4da" stroke-width="1.6"/><line x1="715" y1="470" x2="750.7123837952585" y2="465.45845360475556" stroke="#fd7e14" stroke-width="3.2" stroke-linecap="round"/><circle cx="715" cy="470" r="3" fill="#343a40"/><circle cx="715" cy="610" r="42" fill="#ffffff" stroke="#ced4da" stroke-width="1.6"/><line x1="715" y1="610" x2="750.1215956226944" y2="602.0959807113129" stroke="#4dabf7" stroke-width="3.2" stroke-linecap="round"/><line x1="715" y1="610" x2="750.7123837952585" y2="605.4584536047555" stroke="#fd7e14" stroke-width="3.2" stroke-linecap="round"/><circle cx="715" cy="610" r="3" fill="#343a40"/><text x="715" y="674" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b7280"></text><text x="840" y="293" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280">pair 4</text><circle cx="840" cy="350" r="42" fill="#ffffff" stroke="#ced4da" stroke-width="1.6"/><line x1="840" y1="350" x2="875.911836009118" y2="347.48205749584884" stroke="#4dabf7" stroke-width="3.2" stroke-linecap="round"/><circle cx="840" cy="350" r="3" fill="#343a40"/><circle cx="840" cy="470" r="42" fill="#ffffff" stroke="#ced4da" stroke-width="1.6"/><line x1="840" y1="470" x2="875.9712038397952" y2="468.5603839692812" stroke="#fd7e14" stroke-width="3.2" stroke-linecap="round"/><circle cx="840" cy="470" r="3" fill="#343a40"/><circle cx="840" cy="610" r="42" fill="#ffffff" stroke="#ced4da" stroke-width="1.6"/><line x1="840" y1="610" x2="875.911836009118" y2="607.4820574958488" stroke="#4dabf7" stroke-width="3.2" stroke-linecap="round"/><line x1="840" y1="610" x2="875.9712038397952" y2="608.5603839692811" stroke="#fd7e14" stroke-width="3.2" stroke-linecap="round"/><circle cx="840" cy="610" r="3" fill="#343a40"/><text x="840" y="674" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b7280"></text><text x="965" y="293" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280">pair 5</text><circle cx="965" cy="350" r="42" fill="#ffffff" stroke="#ced4da" stroke-width="1.6"/><line x1="965" y1="350" x2="1000.9911803601441" y2="349.20317110771737" stroke="#4dabf7" stroke-width="3.2" stroke-linecap="round"/><circle cx="965" cy="350" r="3" fill="#343a40"/><circle cx="965" cy="470" r="42" fill="#ffffff" stroke="#ced4da" stroke-width="1.6"/><line x1="965" y1="470" x2="1000.9971200383998" y2="469.54464415998484" stroke="#fd7e14" stroke-width="3.2" stroke-linecap="round"/><circle cx="965" cy="470" r="3" fill="#343a40"/><circle cx="965" cy="610" r="42" fill="#ffffff" stroke="#ced4da" stroke-width="1.6"/><line x1="965" y1="610" x2="1000.9911803601441" y2="609.2031711077174" stroke="#4dabf7" stroke-width="3.2" stroke-linecap="round"/><line x1="965" y1="610" x2="1000.9971200383998" y2="609.5446441599848" stroke="#fd7e14" stroke-width="3.2" stroke-linecap="round"/><circle cx="965" cy="610" r="3" fill="#343a40"/><text x="965" y="674" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b7280"></text><text x="1090" y="293" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280">pair 6</text><circle cx="1090" cy="350" r="42" fill="#ffffff" stroke="#ced4da" stroke-width="1.6"/><line x1="1090" y1="350" x2="1125.9991180036016" y2="349.74800205799494" stroke="#4dabf7" stroke-width="3.2" stroke-linecap="round"/><circle cx="1090" cy="350" r="3" fill="#343a40"/><circle cx="1090" cy="470" r="42" fill="#ffffff" stroke="#ced4da" stroke-width="1.6"/><line x1="1090" y1="470" x2="1125.999712000384" y2="469.8560003839997" stroke="#fd7e14" stroke-width="3.2" stroke-linecap="round"/><circle cx="1090" cy="470" r="3" fill="#343a40"/><circle cx="1090" cy="610" r="42" fill="#ffffff" stroke="#ced4da" stroke-width="1.6"/><line x1="1090" y1="610" x2="1125.9991180036016" y2="609.748002057995" stroke="#4dabf7" stroke-width="3.2" stroke-linecap="round"/><line x1="1090" y1="610" x2="1125.999712000384" y2="609.8560003839997" stroke="#fd7e14" stroke-width="3.2" stroke-linecap="round"/><circle cx="1090" cy="610" r="3" fill="#343a40"/><text x="1090" y="674" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b7280">slow</text><text x="1215" y="293" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280">pair 7</text><circle cx="1215" cy="350" r="42" fill="#ffffff" stroke="#ced4da" stroke-width="1.6"/><line x1="1215" y1="350" x2="1250.999911800036" y2="349.92031066804344" stroke="#4dabf7" stroke-width="3.2" stroke-linecap="round"/><circle cx="1215" cy="350" r="3" fill="#343a40"/><circle cx="1215" cy="470" r="42" fill="#ffffff" stroke="#ced4da" stroke-width="1.6"/><line x1="1215" y1="470" x2="1250.9999712000038" y2="469.95446321383673" stroke="#fd7e14" stroke-width="3.2" stroke-linecap="round"/><circle cx="1215" cy="470" r="3" fill="#343a40"/><circle cx="1215" cy="610" r="42" fill="#ffffff" stroke="#ced4da" stroke-width="1.6"/><line x1="1215" y1="610" x2="1250.999911800036" y2="609.9203106680434" stroke="#4dabf7" stroke-width="3.2" stroke-linecap="round"/><line x1="1215" y1="610" x2="1250.9999712000038" y2="609.9544632138367" stroke="#fd7e14" stroke-width="3.2" stroke-linecap="round"/><circle cx="1215" cy="610" r="3" fill="#343a40"/><text x="1215" y="674" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b7280">slow</text><text x="60" y="355" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#4dabf7">query at</text><text x="60" y="375" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#4dabf7">position m = 7</text><text x="60" y="475" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#fd7e14">key at</text><text x="60" y="495" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#fd7e14">position n = 4</text><text x="60" y="605" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e">q · k sees only</text><text x="60" y="625" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e">the angle between:</text><text x="60" y="645" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#f06595">(m − n) · θᵢ = 3θᵢ</text><rect x="60" y="700" width="1250" height="70" rx="10" fill="#fff0f6" stroke="#f06595" stroke-width="1.6" /><text x="80" y="727" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e">Move both tokens 5 places later (m = 12, n = 9): every hand turns further, but every angle between them stays 3θᵢ,</text><text x="80" y="751" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e">so the attention score is the same. Attention learns relative position for free.</text><text x="40" y="817" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1e1e1e">Fast pairs tell neighbours apart; slow pairs still change over hundreds of tokens.</text></svg>