><text x="1082" y="540" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b7280">9</text><rect x="1104" y="404" width="24" height="116" rx="3" fill="#4dabf7" fill-opacity="0.9"/><text x="1116" y="540" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b7280">10</text><rect x="1138" y="388" width="24" height="132" rx="3" fill="#4dabf7" fill-opacity="0.9"/><text x="1150" y="540" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b7280">11</text><rect x="1172" y="396" width="24" height="124" rx="3" fill="#4dabf7" fill-opacity="0.9"/><text x="1184" y="540" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b7280">12</text><rect x="1206" y="392" width="24" height="128" rx="3" fill="#4dabf7" fill-opacity="0.9"/><text x="1218" y="540" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b7280">13</text><rect x="1240" y="386" width="24" height="134" rx="3" fill="#4dabf7" fill-opacity="0.9"/><text x="1252" y="540" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b7280">14</text><rect x="1274" y="390" width="24" height="130" rx="3" fill="#4dabf7" fill-opacity="0.9"/><text x="1286" y="540" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b7280">15</text><path d="M754 395L1310 395" fill="none" stroke="#f59f00" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/><text x="1314" y="399" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#f59f00">even: 6.25%</text><text x="760" y="576" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#4dabf7">busiest expert: 6.7% = 1.07× its share</text><text x="394" y="194" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#c92a2a">15.6%</text><rect x="60" y="620" width="1360" height="170" rx="10" fill="#f8f0fc" stroke="#ae3ec9" stroke-width="1.6" /><text x="84" y="656" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1e1e1e">The rule, applied after every optimizer step</text><text x="84" y="690" text-anchor="start" font-family="Menlo, Monaco, monospace" font-size="18" font-weight="400" fill="#ae3ec9">bias += 0.001 · sign(average load − this expert's load)</text><rect x="900" y="670" width="34" height="90" rx="3" fill="#868e96" fill-opacity="1"/><path d="M960 680L960 740" fill="none" stroke="#ae3ec9" stroke-width="2.4"  marker-end="url(#ah0)"/><text x="978" y="704" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#ae3ec9">too busy: bias down</text><rect x="1180" y="730" width="34" height="30" rx="3" fill="#868e96" fill-opacity="1"/><path d="M1240 750L1240 690" fill="none" stroke="#ae3ec9" stroke-width="2.4"  marker-end="url(#ah0)"/><text x="1258" y="714" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#ae3ec9">idle: bias up</text><text x="84" y="727" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e">The bias only changes which 4 experts win, never how much they count.</text><text x="84" y="751" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1e1e1e">It isn't a loss, so it never pulls against learning the language.</text><text x="40" y="847" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1e1e1e">Same model, same data: validation loss was 3.921 with the bias and 3.923 without. Balance is free.</text></svg>