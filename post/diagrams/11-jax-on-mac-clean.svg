<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="850" viewBox="0 0 1460 850"><defs><marker id="ah0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker></defs><rect width="100%" height="100%" fill="#fbfbfa"/><text x="40" y="64" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1e1e1e">How 190 lines of Python reach the M5's GPU</text><text x="40" y="93" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#6b7280">pinned: jax 0.4.34 + jax-metal 0.1.1</text><rect x="60" y="140" width="480" height="66" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.6" /><text x="80" y="169" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1e1e1e">deepseek_v3.py</text><text x="80" y="190" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#6b7280">pure functions, params as dicts</text><rect x="60" y="222" width="480" height="66" rx="10" fill="#ffffff" stroke="#4dabf7" stroke-width="1.6" /><text x="80" y="251" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1e1e1e">JAX</text><text x="80" y="272" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#6b7280">jit · grad · pytrees</text><path d="M300 208L300 220" fill="none" stroke="#6b7280" stroke-width="1.6"  marker-end="url(#ah0)"/><rect x="60" y="304" width="480" height="66" rx="10" fill="#ffffff" stroke="#5b7bd5" stroke-width="1.6" /><text x="80" y="333" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1e1e1e">XLA</text><text x="80" y="354" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#6b7280">compiles the whole train step</text><path d="M300 290L300 302" fill="none" stroke="#6b7280" stroke-width="1.6"  marker-end="url(#ah0)"/><rect x="60" y="386" width="480" height="66" rx="10" fill="#ffffff" stroke="#9775fa" stroke-width="1.6" /><text x="80" y="415" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1e1e1e">jax-metal (PJRT)</text><text x="80" y="436" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#6b7280">Apple's plugin, needs jax 0.4.34</text><path d="M300 372L300 384" fill="none" stroke="#6b7280" stroke-width="1.6"  marker-end="url(#ah0)"/><rect x="60" y="468" width="480" height="66" rx="10" fill="#ffffff" stroke="#38b07a" stroke-width="1.6" /><text x="80" y="497" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1e1e1e">Metal Performance Shaders</text><text x="80" y="518" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#6b7280">GPU kernels</text><path d="M300 454L300 466" fill="none" stroke="#6b7280" stroke-width="1.6"  marker-end="url(#ah0)"/><rect x="60" y="560" width="480" height="210" rx="14" fill="#212529" stroke="#1e1e1e" stroke-width="1.6" /><text x="80" y="590" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Apple M5 · 24 GB unified memory</text><rect x="84" y="606" width="72" height="52" rx="6" fill="#1c3d5a" stroke="#4dabf7" stroke-width="1.6" /><rect x="172" y="606" width="72" height="52" rx="6" fill="#1c3d5a" stroke="#4dabf7" stroke-width="1.6" /><rect x="260" y="606" width="72" height="52" rx="6" fill="#1c3d5a" stroke="#4dabf7" stroke-width="1.6" /><rect x="348" y="606" width="72" height="52" rx="6" fill="#1c3d5a" stroke="#4dabf7" stroke-width="1.6" /><rect x="436" y="606" width="72" height="52" rx="6" fill="#1c3d5a" stroke="#4dabf7" stroke-width="1.6" /><rect x="84" y="672" width="72" height="52" rx="6" fill="#1c3d5a" stroke="#4dabf7" stroke-width="1.6" /><rect x="172" y="672" width="72" height="52" rx="6" fill="#1c3d5a" stroke="#4dabf7" stroke-width="1.6" /><rect x="260" y="672" width="72" height="52" rx="6" fill="#1c3d5a" stroke="#4dabf7" stroke-width="1.6" /><rect x="348" y="672" width="72" height="52" rx="6" fill="#1c3d5a" stroke="#4dabf7" stroke-width="1.6" /><rect x="436" y="672" width="72" height="52" rx="6" fill="#1c3d5a" stroke="#4dabf7" stroke-width="1.6" /><text x="300" y="746" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#adb5bd">10 GPU cores</text><path d="M300 534L300 556" fill="none" stroke="#6b7280" stroke-width="1.6"  marker-end="url(#ah0)"/><text x="640" y="167" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1e1e1e">matmul speed (2048 × 2048)</text><text x="640" y="211" text-anchor="start" font-family="Menlo, Monaco, monospace" font-size="15" font-weight="400" fill="#1e1e1e">float32</text><rect x="760" y="192" width="126.96" height="30" rx="3" fill="#868e96" fill-opacity="1"/><text x="894.96" y="212" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e1e1e">2.76 TFLOP/s</text><text x="640" y="257" text-anchor="start" font-family="Menlo, Monaco, monospace" font-size="15" font-weight="400" fill="#1e1e1e">bfloat16</text><rect x="760" y="238" width="510.59999999999997" height="30" rx="3" fill="#4dabf7" fill-opacity="1"/><text x="1278.6" y="258" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e1e1e">11.10 TFLOP/s</text><text x="640" y="337" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1e1e1e">training speed over the 3-hour run (average tokens/s so far)</text><path d="M640 580L1400 580" fill="none" stroke="#adb5bd" stroke-width="1.4" stroke-linecap="round" /><path d="M640 580L1400 580" fill="none" stroke="#e9ecef" stroke-width="1.4" stroke-linecap="round" /><text x="632" y="583" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b7280">8k</text><path d="M640 482.22222222222223L1400 482.22222222222223" fill="none" stroke="#e9ecef" stroke-width="1.4" stroke-linecap="round" /><text x="632" y="485.22222222222223" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b7280">10k</text><path d="M640 384.44444444444446L1400 384.44444444444446" fill="none" stroke="#e9ecef" stroke-width="1.4" stroke-linecap="round" /><text x="632" y="387.44444444444446" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b7280">12k</text><path d="M703.3 415.4L766.7 404.8L830.0 395.6L893.3 389.8L956.7 381.5L1020.0 436.2L1083.3 479.6L1146.7 477.8L1210.0 516.2L1273.3 531.3L1336.7 533.6L1400.0 536.5" fill="none" stroke="#fd7e14" stroke-width="3" stroke-linejoin="round"/><circle cx="703.3333333333334" cy="415.44" r="4" fill="#fd7e14" stroke="#fd7e14" stroke-width="1.8"/><circle cx="766.6666666666666" cy="404.8311111111111" r="4" fill="#fd7e14" stroke="#fd7e14" stroke-width="1.8"/><circle cx="830" cy="395.64" r="4" fill="#fd7e14" stroke="#fd7e14" stroke-width="1.8"/><circle cx="893.3333333333333" cy="389.8222222222222" r="4" fill="#fd7e14" stroke="#fd7e14" stroke-width="1.8"/><circle cx="956.6666666666667" cy="381.4622222222222" r="4" fill="#fd7e14" stroke="#fd7e14" stroke-width="1.8"/><circle cx="1020" cy="436.21777777777777" r="4" fill="#fd7e14" stroke="#fd7e14" stroke-width="1.8"/><circle cx="1083.3333333333335" cy="479.6311111111111" r="4" fill="#fd7e14" stroke="#fd7e14" stroke-width="1.8"/><circle cx="1146.6666666666665" cy="477.7733333333333" r="4" fill="#fd7e14" stroke="#fd7e14" stroke-width="1.8"/><circle cx="1210" cy="516.1511111111112" r="4" fill="#fd7e14" stroke="#fd7e14" stroke-width="1.8"/><circle cx="1273.3333333333335" cy="531.3066666666666" r="4" fill="#fd7e14" stroke="#fd7e14" stroke-width="1.8"/><circle cx="1336.6666666666665" cy="533.5555555555555" r="4" fill="#fd7e14" stroke="#fd7e14" stroke-width="1.8"/><circle cx="1400" cy="536.4888888888889" r="4" fill="#fd7e14" stroke="#fd7e14" stroke-width="1.8"/><text x="926.6666666666667" y="364.4622222222222" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#fd7e14">12.1k</text><text x="1360" y="561.4888888888889" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#fd7e14">8.9k</text><text x="640" y="602" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b7280">step 0</text><text x="1340" y="602" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b7280">step 12,000</text><text x="1051.6666666666665" y="427.77777777777777" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#6b7280">no fan: the chip heats up</text><text x="1051.6666666666665" y="447.77777777777777" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#6b7280">and throttles by ~30%</text><rect x="640" y="650" width="760" height="110" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="1.6" /><text x="660" y="680" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#c92a2a">The one Metal gap we hit</text><text x="660" y="706" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e">Grad of einsum("bthd,bsd-&gt;bhts") contracts two axes at once; jax-metal can't compile it.</text><text x="660" y="730" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e1e1e">Fix: broadcast the shared RoPE key to all 6 heads, then score with one einsum. Same math.</text><text x="40" y="817" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1e1e1e">No CUDA, no cloud: XLA compiles the train step once and Apple's plugin runs it on the laptop's GPU.</text></svg>